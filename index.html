<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Editing Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .background {
      z-index: 1;
    }

 .workshop {
  z-index: 2;
  width: 50%;
  height: 50%;
  top: 50%;
  left: 50%;
  inset: auto;
  transform: translate(-50%, -50%);
  border-radius: 12px;
  overflow: hidden;
}
  </style>
</head>

<body>
  <iframe
    class="background"
    src="main-background.html"
    title="Main background">
  </iframe>

  <iframe
    class="workshop"
    src="workshop/index.html"
    title="Workshop">
  </iframe>
</body>
</html>
