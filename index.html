<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Editing Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      border: 0;
    }

    .background {
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .workshop {
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transform: scale(0.5);
      transform-origin: center center;
    }
.workshop-toggle {
  position: fixed;
  inset: auto;
  z-index: 999;
  width: 120px;
  height: 44px;
  left: 50%;
  top: 76%;
  transform: translateX(-50%);
}

    .workshop.closed {
      display: none;
    }
  </style>
</head>

<body>
  <iframe
    class="background"
    src="main-background.html"
    title="Main background">
  </iframe>

  <iframe
    class="workshop"
    src="workshop/index.html"
    title="Workshop">
  </iframe>

  <iframe
    class="workshop-toggle"
    src="toggle.html"
    title="Toggle Workshop">
  </iframe>

  <script>
    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin) return;

      if (event.data?.type === "toggle-workshop") {
        document
          .querySelector(".workshop")
          .classList.toggle("closed");
      }
    });
  </script>
</body>
</html>
