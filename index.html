<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Editing Tool</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

iframe {
  position: fixed;
  border: 0;
}

.background {
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.workshop {
  z-index: 2;
  left: 52%;
  top: 48%;
  width: 44%;
  height: 50%;
  transform: none;
}

.workshop-toggle,
.save-tool {
  left: 0;
  right: 0;
  margin-inline: auto;
}

.workshop-toggle {
  z-index: 999;
  width: 120px;
  height: 44px;
  top: 76%;
}

.save-tool {
  z-index: 1000;
  width: 160px;
  height: 64px;
  top: 84%;
  background: transparent;
}

.workshop.closed {
  display: none;
}
</style>
</head>

<body>

<iframe
  class="background"
  src="main-background.html"
  title="Main background">
</iframe>

<iframe
  class="workshop"
  src="workshop/index.html"
  title="Workshop Renderer">
</iframe>

<iframe
  class="workshop-toggle"
  src="toggle.html"
  title="Toggle Workshop">
</iframe>

<iframe
  class="save-tool"
  src="save/index.html"
  title="Save Tool">
</iframe>

<script>
window.addEventListener("message", event => {
  if (event.origin !== location.origin) return;

  if (event.data?.type === "toggle-workshop") {
    document.querySelector(".workshop")
      .classList.toggle("closed");
  }
});
</script>

</body>
</html>
