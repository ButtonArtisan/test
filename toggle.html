<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop Toggle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    button {
      display: block;
      width: 100%;
      height: 100%;
      border: 2px solid #888;
      border-radius: 8px;
      background: #555;
      color: #fff;
      cursor: pointer;
      font: 16px system-ui, sans-serif;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>
  <button id="toggle" aria-label="Open or close workshop">
    Toggle
  </button>

  <script>
    document.getElementById("toggle").onclick = () => {
      window.parent.postMessage(
        { type: "toggle-workshop" },
        window.location.origin
      );
    };
  </script>
</body>
</html>
